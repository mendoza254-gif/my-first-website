
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>My First API Connection</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    main {
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    input, button {
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }

    input {
      max-width: 120px;
    }

    button {
      background: #176b46;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    pre {
      background: #eef2f6;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main>
    <h1>My First API Connection</h1>

    <p>Look up a fictional record using an API.</p>

    <label for="recordId">Record ID:</label>

    <input
      type="number"
      id="recordId"
      min="1"
      max="999"
      step="1"
      value="1"
    >

    <button type="button" id="lookupButton">
      Find Record
    </button>

    <p id="status" role="status"></p>

    <pre id="result" hidden></pre>
  </main>

  <script>
    const button = document.getElementById("lookupButton");
    const input = document.getElementById("recordId");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    button.addEventListener("click", async function() {
      const rawId = input.value.trim();
      const recordId = Number(rawId);

      // Check the input before contacting the API
      if (
        rawId === "" ||
        !Number.isInteger(recordId) ||
        recordId < 1 ||
        recordId > 999
      ) {
        status.textContent = "Enter a valid whole-number ID.";
        result.hidden = true;
        return;
      }

      button.disabled = true;
      status.textContent = "Searching...";
      result.hidden = true;

      try {
        // Ask the API for the selected record
        const response = await fetch(
          `https://jsonplaceholder.typicode.com/users/${recordId}`
        );

        // Check whether the API request succeeded
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        // Convert the response into JavaScript data
        const data = await response.json();

        // Display selected information
        result.textContent = JSON.stringify({
          id: data.id,
          name: data.name,
          username: data.username,
          email: data.email,
          company: data.company.name
        }, null, 2);

        result.hidden = false;
        status.textContent = "Record found!";

      } catch (error) {
        status.textContent =
          "Unable to retrieve record: " + error.message;

      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
